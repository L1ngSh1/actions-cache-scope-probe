name: token-scope-probe
on: pull_request
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      ACTIONS_STEP_DEBUG: true
    steps:
      - uses: actions/checkout@v4
      - name: upload own artifact first (positive control)
        run: echo "OWN-RUN-${{ github.run_id }}" > own.txt
      - uses: actions/upload-artifact@v4
        with:
          name: own-pr-artifact
          path: own.txt
      - name: P0 action-process probe
        uses: ./probe-action
