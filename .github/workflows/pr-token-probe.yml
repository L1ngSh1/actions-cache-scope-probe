name: token-scope-probe
on: pull_request
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: P0 action-process probe
        uses: ./probe-action
      - name: P1 decode runtime token claims
        run: |
          python3 - <<'PYEOF'
          import base64, json, os
          t = os.environ.get('ACTIONS_RUNTIME_TOKEN','')
          print("token len:", len(t), "prefix:", t[:10])
          parts = t.split('.')
          if len(parts) >= 2:
              p = parts[1]; p += '=' * (-len(p) % 4)
              try:
                  claims = json.loads(base64.urlsafe_b64decode(p))
                  # 值里的敏感字段打码保留结构
                  def mask(o):
                      if isinstance(o, dict):
                          return {k: (v[:6]+'...' if isinstance(v,str) and len(v)>40 and ('token' in k.lower() or 'sig' in k.lower()) else mask(v)) for k,v in o.items()}
                      return o
                  print("CLAIMS:", json.dumps(mask(claims), indent=1))
              except Exception as e:
                  print("decode error:", e)
          else:
              print("token not in jwt format")
          PYEOF
      - name: P4 upload own artifact (positive control)
        run: echo "OWN-RUN-${{ github.run_id }}" > own.txt
      - uses: actions/upload-artifact@v4
        with:
          name: own-pr-artifact
          path: own.txt
      - name: P3 twirp ListArtifacts with PR runtime token
        run: |
          RU="${ACTIONS_RESULTS_URL%/}"
          echo "RESULTS_URL=$RU"
          echo "== ListArtifacts no filter:"
          curl -s -X POST "$RU/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts" \
            -H "Content-Type: application/json" -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
            -d '{}' | head -c 3000; echo
      - name: P2 REST download of foreign (main-run) artifact
        run: |
          curl -s "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=10" > arts.json
          echo "== inventory:"
          python3 -c "
          import json
          d=json.load(open('arts.json'))
          for a in d.get('artifacts',[]):
              print(a['id'], a['name'], 'run', a['workflow_run']['id'])
          "
          IDS=$(python3 -c "
          import json
          d=json.load(open('arts.json'))
          ids=[str(a['id']) for a in d.get('artifacts',[])]
          print(' '.join(ids) if ids else '')
          ")
          for AID in $IDS; do
            RT=$(curl -s -o /dev/null -w "%{http_code}" -L -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$AID/zip")
            ANON=$(curl -s -o /dev/null -w "%{http_code}" -L \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$AID/zip")
            echo "artifact $AID: runtime_token=$RT anon=$ANON"
          done
